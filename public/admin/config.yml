backend:
  name: github
  repo: Gasterartur/logoped
  branch: main
  base_url: https://logoped-sage.vercel.app
  auth_endpoint: api/auth

publish_mode: simple
media_folder: "src/assets/images"
public_folder: "/src/assets/images"

collections:
  - name: "prices"
    label: "Цены (главная страница)"
    files:
      - name: "prices"
        label: "Тарифы"
        file: "src/content/prices.json"
        fields:
          - label: "Тарифы"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{price}}"
            fields:
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Цена", name: "price", widget: "string" }
              - { label: "Подпись под ценой", name: "duration", widget: "string" }
              - label: "Что входит"
                name: "features"
                widget: "list"
                field: { label: "Пункт", name: "item", widget: "string" }
              - { label: "Бейдж (необязательно)", name: "badge", widget: "string", required: false }
              - { label: "Выделить карточку зелёной рамкой", name: "highlighted", widget: "boolean", default: false }

  - name: "services"
    label: "Услуги (карточки на главной)"
    files:
      - name: "services"
        label: "Описания услуг"
        file: "src/content/services.json"
        fields:
          - label: "Услуги"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { name: "id", widget: "hidden" }
              - { label: "Название карточки", name: "title", widget: "string" }
              - { label: "Описание", name: "text", widget: "text" }

  - name: "reviews"
    label: "Отзывы"
    files:
      - name: "reviews"
        label: "Отзывы клиентов"
        file: "src/content/reviews.json"
        fields:
          - label: "Отзывы"
            name: "items"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Имя автора", name: "name", widget: "string" }
              - { label: "Подпись (кто, чей ребёнок)", name: "subtitle", widget: "string" }
              - { label: "Ссылка на профиль VK", name: "vk", widget: "string" }
              - { label: "Текст отзыва", name: "text", widget: "text" }
              - { label: "Оценка", name: "rating", widget: "number", default: 5, min: 1, max: 5, value_type: "int" }
