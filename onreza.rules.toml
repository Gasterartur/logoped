schema = "EDGE_RULE_SET_V1"

[[rule]]
id = "admin-api"
when.path = { prefix = "/api/admin" }
action.pipeline = { override = true, steps = [ { handle = "admin-api" } ] }

[[rule]]
id = "spa-fallback"
when.path = { glob = "/{rest...}" }
when.not = { path = { prefix = "/api" } }
action.rewrite = { target = "/index.html", if_no_file = true }
