schema = "EDGE_RULE_SET_V1"

[[rule]]
id = "admin-index"
when.path = { exact = "/admin" }
action.rewrite = { target = "/admin/index.html" }

[[rule]]
id = "cms-auth"
when.path = { exact = "/api/auth" }
action.pipeline = { override = true, steps = [ { handle = "cms-auth" } ] }

[[rule]]
id = "cms-callback"
when.path = { exact = "/api/callback" }
action.pipeline = { override = true, steps = [ { handle = "cms-callback" } ] }

[[rule]]
id = "spa-fallback"
when.path = { glob = "/{rest...}" }
when.not = { path = { prefix = "/api" } }
action.rewrite = { target = "/index.html", if_no_file = true }
